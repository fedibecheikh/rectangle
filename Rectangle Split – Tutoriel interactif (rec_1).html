<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutoriel interactif – Rectangle Split (Flutter)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--card:#fff;--ink:#1b2033;--mut:#6b7289;--line:#e1e4ee;--pri:#4f46e5;--pri2:#eef0ff;--ok:#16a34a;--bad:#dc2626;--hot:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--ink:#e8eaf6;--mut:#9aa1bd;--line:#2a2f4a;--pri:#8b8cff;--pri2:#23274a}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--ink:#e8eaf6;--mut:#9aa1bd;--line:#2a2f4a;--pri:#8b8cff;--pri2:#23274a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}h1 small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.sp{flex:1}.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.seg button.on{background:var(--pri);color:#fff}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13.5px}
.bar{height:4px;background:var(--line)}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;padding:16px 20px;max-width:1500px;margin:auto}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18);user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;border:2.5px solid var(--hot);border-radius:6px;box-shadow:0 0 0 9999px rgba(8,10,25,.38);pointer-events:none;animation:p 1.4s infinite}
.hot.full{display:none}
@keyframes p{50%{box-shadow:0 0 0 9999px rgba(8,10,25,.38),0 0 0 6px rgba(245,158,11,.35)}}
.pad{position:absolute;inset:0;cursor:pointer}
.tip{position:absolute;width:min(300px,60%);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:3}
.tip .n{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tip .t{font-size:15.5px;margin:2px 0 0}.tip .e{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
.tip input{margin-top:8px;width:100%;padding:8px 10px;border:1.5px solid var(--pri);border-radius:8px;background:var(--bg);color:var(--ink);font:14px ui-monospace,Consolas,monospace}
kbd{background:var(--pri2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:12.5px ui-monospace,monospace}
.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ctl{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--mut);font-size:13px}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:calc((100vw - 330px)*.5625 + 60px);min-height:320px;overflow:auto}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:4px 8px 8px}
.st{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.st:hover{background:var(--bg)}.st.cur{background:var(--pri2);font-weight:600}
.st .d{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut)}
.st.done .d{background:var(--ok);border-color:var(--ok);color:#fff}.st.cur .d{border-color:var(--pri);color:var(--pri)}
.end{position:absolute;inset:0;background:rgba(10,12,28,.88);display:none;place-items:center;text-align:center;color:#fff;z-index:5;padding:20px}
.end.on{display:grid}.end h2{font-size:28px;margin:0 0 6px}.end p{margin:4px 0 18px;color:#c8cce6}
.stats{display:flex;gap:26px;justify-content:center;margin-bottom:20px}.stats b{display:block;font-size:26px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:10px}aside{max-height:260px;min-height:0}header{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

let cur=0,mode='D',err=0,t0=Date.now(),done=new Set();
const K={click:'Clic',dbl:'Double-clic',type:'Saisie',key:'Raccourci'};
const list=$('list');
S.forEach((s,i)=>{const b=document.createElement('button');b.className='st';b.innerHTML=`<span class="d">${i+1}</span><span>${s.text}</span>`;b.onclick=()=>go(i);list.appendChild(b)});
function strip(h){return h.replace(/<[^>]+>/g,'')}
function go(i){
 cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
 $('end').classList.remove('on');$('im').src=I[s.img];
 const h=$('hot');h.className='hot'+(s.full?' full':'');
 h.style.cssText=`left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%`;
 $('tn').textContent=`Étape ${cur+1} / ${S.length} · ${K[s.kind]}`;$('tt').innerHTML=s.text;$('te').textContent='';$('ti').innerHTML='';
 if(s.kind==='key'&&mode==='D')$('ti').innerHTML='<div class="hint" style="margin-top:6px">Touche à presser sur le clavier.</div>';
 if(s.kind==='type'&&mode==='P'){const inp=document.createElement('input');inp.placeholder='Tapez puis Entrée…';inp.autocomplete='off';inp.spellcheck=false;
  inp.onkeydown=e=>{if(e.key==='Enter')ok(inp.value)};$('ti').appendChild(inp);setTimeout(()=>inp.focus(),30)}
 if(s.kind==='type'&&mode==='D')$('ti').innerHTML=`<div class="hint" style="margin-top:6px">Texte : <kbd>${s.expect}</kbd></div>`;
 // tooltip placement
 const t=$('tip');const cx=s.x+s.w/2;let left=s.full?35:Math.min(Math.max(cx-17,2),60);
 let top=s.full?40:(s.y+s.h+3>68?Math.max(s.y-26,2):s.y+s.h+3);t.style.left=left+'%';t.style.top=top+'%';
 $('pb').style.width=(cur/S.length*100)+'%';
 [...list.children].forEach((b,k)=>{b.classList.toggle('cur',k===cur);b.classList.toggle('done',done.has(k));b.firstChild.textContent=done.has(k)?'✓':k+1});
 list.children[cur].scrollIntoView({block:'nearest'});
 $('pv').disabled=cur===0;$('pad').style.display=mode==='P'&&(s.kind==='click'||s.kind==='dbl')?'block':'none';
 $('hh').textContent=mode==='P'?(s.kind==='key'?'Appuyez sur la bonne touche':s.kind==='type'?'Saisissez le texte demandé':'Cliquez dans la zone surlignée'):'Raccourcis : ← → pour naviguer';
}
function next(){done.add(cur);if(cur===S.length-1){finish();return}go(cur+1)}
function ok(v){const s=S[cur];if(v===s.expect)next();else bad('Texte incorrect — attendu : '+s.expect.replace(/./g,(c,i)=>i<2?c:'•'))}
function bad(m){err++;$('te').textContent=m;const t=$('tip');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}
function inHot(e){const r=$('stage').getBoundingClientRect(),s=S[cur],px=(e.clientX-r.left)/r.width*100,py=(e.clientY-r.top)/r.height*100;
 return px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h}
$('pad').addEventListener('click',e=>{const s=S[cur];if(s.kind!=='click')return;inHot(e)?next():bad('Ce n’est pas le bon endroit. Cherchez la zone surlignée.')});
$('pad').addEventListener('dblclick',e=>{const s=S[cur];if(s.kind==='dbl')inHot(e)?next():bad('Ce n’est pas le bon endroit.')});
$('pad').addEventListener('click',e=>{const s=S[cur];if(s.kind==='dbl'&&e.detail===1)$('te').textContent='Il faut double-cliquer ici.'});
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;const s=S[cur];
 if(mode==='P'&&s.kind==='key'){const m=s.text.includes('Caps')?e.key==='CapsLock':(e.ctrlKey&&e.key==='Backspace');
  if(m){e.preventDefault();next()}else if(!['Shift','Control','Alt','Meta'].includes(e.key))bad('Ce n’est pas la bonne touche.');return}
 if(e.key==='ArrowRight')next2();if(e.key==='ArrowLeft')go(cur-1)});
function next2(){if(cur<S.length-1)go(cur+1)}
$('nx').onclick=()=>mode==='D'?(cur===S.length-1?(done.add(cur),finish()):next2()):next();
$('pv').onclick=()=>go(cur-1);
$('hn').onclick=()=>{const s=S[cur];$('te').style.color='var(--ok)';$('te').textContent='Indice : '+strip(s.text)+(s.expect?' → '+s.expect:'');setTimeout(()=>$('te').style.color='',2500)};
function setMode(m){mode=m;$('mD').classList.toggle('on',m==='D');$('mP').classList.toggle('on',m==='P');$('nx').textContent=m==='D'?'Suivant →':'Passer l’étape →';go(cur)}
$('mD').onclick=()=>setMode('D');$('mP').onclick=()=>setMode('P');
function finish(){const d=Math.round((Date.now()-t0)/1000);$('s1').textContent=S.length;$('s2').textContent=Math.floor(d/60)+'m'+String(d%60).padStart(2,'0');$('s3').textContent=err;$('pb').style.width='100%';$('end').classList.add('on')}
$('rs').onclick=()=>{done.clear();err=0;t0=Date.now();go(0)};
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen&&$('stage').requestFullscreen();
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark'};
go(0);
</script></body></html>
